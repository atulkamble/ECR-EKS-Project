apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: myapp
          image: 535002879962.dkr.ecr.us-east-1.amazonaws.com/cloudnautic/myapp:latest
          ports:
            - containerPort: 80

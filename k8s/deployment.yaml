apiVersion: apps/v1
kind: Deployment
metadata:
  name: mywebapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mywebapp
  template:
    metadata:
      labels:
        app: mywebapp
    spec:
      containers:
        - name: mywebapp
          image: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/mywebapp:v1
          ports:
            - containerPort: 80
